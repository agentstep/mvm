name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-binaries:
    # GoReleaser only builds the macOS binary, but the self-hosted Linux install
    # (scripts/install-cloud.sh) needs linux binaries published as raw release
    # assets named <name>-linux-<x86_64|aarch64> (uname -m). Build + attach them.
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build and upload linux binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${TAG#v} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for goarch in amd64 arm64; do
            case "$goarch" in amd64) uarch=x86_64 ;; arm64) uarch=aarch64 ;; esac
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch go build -ldflags "$LDFLAGS" -o "mvm-linux-$uarch" ./cmd/mvm
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch go build -ldflags "-s -w" -o "mvm-uffd-linux-$uarch" ./cmd/mvm-uffd
            ( cd agent && CGO_ENABLED=0 GOOS=linux GOARCH=$goarch go build -ldflags "-s -w" -o "../mvm-agent-linux-$uarch" . )
            gh release upload "$TAG" "mvm-linux-$uarch" "mvm-uffd-linux-$uarch" "mvm-agent-linux-$uarch" --clobber
          done

  npm:
    runs-on: macos-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o npm-platform/bin/mvm ./cmd/mvm
          chmod +x npm-platform/bin/mvm
          ls -lh npm-platform/bin/mvm

      - name: Sync versions from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../npm-platform && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish platform package first
        run: cd npm-platform && npm publish --access public || echo "Version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for platform package to propagate
        run: sleep 10

      - name: Publish wrapper package
        run: cd npm && npm publish --access public || echo "Version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
